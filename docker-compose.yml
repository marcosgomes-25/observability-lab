name: zabbix-lab

# Laboratório Zabbix 8 (pré-release / trunk)
# ATENÇÃO: as imagens :alpine-trunk são builds de desenvolvimento do que
# será o Zabbix 8.0. Servem para teste de funcionalidades, NÃO para produção.
# Podem quebrar entre atualizações. Para uso estável troque para alpine-7.0-latest.

x-db-env: &db-env
  DB_SERVER_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-zabbix}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
  POSTGRES_DB: ${POSTGRES_DB:-zabbix}

services:
  postgres:
    image: postgres:16-alpine
    container_name: zabbix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [zabbix-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-trunk
    container_name: zabbix-server
    environment:
      <<: *db-env
      ZBX_STARTPOLLERS: 5
      ZBX_CACHESIZE: 32M
    ports:
      - "10051:10051"        # porta de comunicação server <-> agents/proxies
    depends_on:
      postgres:
        condition: service_healthy
    networks: [zabbix-net]
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-trunk
    container_name: zabbix-web
    environment:
      <<: *db-env
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8080:8080"          # interface web -> http://localhost:8080
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks: [zabbix-net]
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-trunk
    container_name: zabbix-agent
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
    ports:
      - "10050:10050"
    depends_on:
      zabbix-server:
        condition: service_started
    networks: [zabbix-net]
    restart: unless-stopped

  # ---------- Observabilidade: Prometheus + exporters + Grafana ----------

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-remote-write-receiver'          # recebe span-metrics do Tempo
      - '--enable-feature=exemplar-storage,native-histograms'
    ports:
      - "9090:9090"           # UI Prometheus -> http://localhost:9090
    networks: [zabbix-net]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks: [zabbix-net]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [zabbix-net]
    restart: unless-stopped

  # ---------- Logs (Loki + Alloy) e Traces (Tempo) ----------

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"           # API Loki
    networks: [zabbix-net]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    ports:
      - "12345:12345"         # UI do Alloy
    depends_on:
      loki:
        condition: service_started
    networks: [zabbix-net]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"           # API Tempo (TraceQL)
      - "4317:4317"           # OTLP gRPC
      - "4318:4318"           # OTLP HTTP
    networks: [zabbix-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?defina GF_ADMIN_PASSWORD no .env (veja .env.example)}
      # credenciais da API do Zabbix, interpoladas em provisioning/datasources/datasources.yml
      ZABBIX_API_USER: ${ZABBIX_API_USER:-Admin}
      ZABBIX_API_PASSWORD: ${ZABBIX_API_PASSWORD:?defina ZABBIX_API_PASSWORD no .env (veja .env.example)}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app,grafana-graphviz-panel
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"           # Grafana -> http://localhost:3000
    depends_on:
      prometheus:
        condition: service_started
      zabbix-web:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks: [zabbix-net]
    restart: unless-stopped

  # ---------- Aplicacao de exemplo: conversor de temperatura (Node.js) ----------

  tempconv:
    build: ./app
    image: tempconv:local
    container_name: tempconv
    environment:
      PORT: "3000"
      OTEL_SERVICE_NAME: tempconv
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8090:3000"           # app -> http://localhost:8090  (/, /convert, /metrics)
    depends_on:
      tempo:
        condition: service_started
    networks: [zabbix-net]
    restart: unless-stopped

  # gerador de trafego para popular os graficos (pare com: docker compose stop tempconv-loadgen)
  tempconv-loadgen:
    image: curlimages/curl:latest
    container_name: tempconv-loadgen
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
        v=$$(awk 'BEGIN{srand();print int(rand()*160-40)}');
        curl -s "http://tempconv:3000/convert?celsius=$$v" > /dev/null;
        curl -s "http://tempconv:3000/convert?fahrenheit=$$v" > /dev/null;
        curl -s "http://tempconv:3000/convert?kelvin=$$v" > /dev/null;
        [ $$(awk 'BEGIN{srand();print (rand()<0.2)?1:0}') -eq 1 ] && curl -s "http://tempconv:3000/convert?celsius=abc" > /dev/null;
        sleep 3;
        done
    depends_on:
      tempconv:
        condition: service_started
    networks: [zabbix-net]
    restart: unless-stopped

networks:
  zabbix-net:
    driver: bridge

volumes:
  pgdata:
  promdata:
  grafanadata:
  lokidata:
  tempodata:
  alloydata:
